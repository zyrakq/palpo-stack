services:
  palpo:
    environment:
      PALPO_OIDC__ENABLE: ${PALPO_OIDC__ENABLE:-true}
      PALPO_OIDC__ALLOW_REGISTRATION: ${PALPO_OIDC__ALLOW_REGISTRATION:-true}
      PALPO_OIDC__ENABLE_PKCE: ${PALPO_OIDC__ENABLE_PKCE:-true}
      PALPO_OIDC__USER_MAPPING: ${PALPO_OIDC__USER_MAPPING:-email}
      PALPO_OIDC__DEFAULT_PROVIDER: ${PALPO_OIDC__DEFAULT_PROVIDER}
      PALPO_OIDC__SESSION_TIMEOUT: ${PALPO_OIDC__SESSION_TIMEOUT:-600}
      PALPO_OIDC__PROVIDERS__SSO__ISSUER: ${PALPO_OIDC__PROVIDERS__SSO__ISSUER}
      PALPO_OIDC__PROVIDERS__SSO__CLIENT_ID: ${PALPO_OIDC__PROVIDERS__SSO__CLIENT_ID}
      PALPO_OIDC__PROVIDERS__SSO__CLIENT_SECRET: ${PALPO_OIDC__PROVIDERS__SSO__CLIENT_SECRET}
      PALPO_OIDC__PROVIDERS__SSO__REDIRECT_URI: ${PALPO_OIDC__PROVIDERS__SSO__REDIRECT_URI}
      PALPO_OIDC__PROVIDERS__SSO__SCOPES: ${PALPO_OIDC__PROVIDERS__SSO__SCOPES}
      PALPO_OIDC__PROVIDERS__SSO__DISPLAY_NAME: ${PALPO_OIDC__PROVIDERS__SSO__DISPLAY_NAME}
      PALPO_DELEGATED_AUTH__ENABLE: ${PALPO_DELEGATED_AUTH__ENABLE:-true}
      PALPO_DELEGATED_AUTH__ISSUER: ${PALPO_OIDC__PROVIDERS__SSO__ISSUER}
      PALPO_DELEGATED_AUTH__CLIENT_ID: ${PALPO_OIDC__PROVIDERS__SSO__CLIENT_ID}